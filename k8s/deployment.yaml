apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-pdf-qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-pdf-qa
  template:
    metadata:
      labels:
        app: rag-pdf-qa
    spec:
      containers:
        - name: rag-pdf-qa
          image: purveshgandhii/rag-pdf-qa:8
          ports:
            - containerPort: 8501
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-pdf-qa-secrets
                  key: GROQ_API_KEY
---

